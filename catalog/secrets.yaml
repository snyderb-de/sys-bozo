# Secret setup sketch.
# sys-bozo may create this structure for users, but real encrypted values
# belong to their own repo or local machine.

age:
  keyPath: "~/.config/sops/age/keys.txt"

sops:
  configPath: ".sops.yaml"
  encryptedFiles:
    - "secrets/ssh-config.yaml"
    - "secrets/hosts.yaml"
    - "secrets/env.yaml"

outputs:
  sshPrivateConfig:
    sourceKey: "ssh_private_config"
    target: "~/.config/ssh/config.d/private.conf"

  auditHosts:
    sourceKey: "dotfiles_audit_hosts"
    target: "~/.config/dotfiles-audit/hosts"
